apiVersion: v1
kind: ServiceAccount
metadata:
  name: jenkins-agentes
  namespace: ns-juan-pablo-morales-hasard
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: jenkins-agentes
  namespace: ns-juan-pablo-morales-hasard
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["create", "delete", "get", "list", "watch", "patch"]
  - apiGroups: [""]
    resources: ["pods/exec"]
    verbs: ["create", "get"]
  - apiGroups: [""]
    resources: ["pods/log", "events"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: jenkins-agentes
  namespace: ns-juan-pablo-morales-hasard
subjects:
  - kind: ServiceAccount
    name: jenkins-agentes
    namespace: ns-juan-pablo-morales-hasard
roleRef:
  kind: Role
  name: jenkins-agentes
  apiGroup: rbac.authorization.k8s.io